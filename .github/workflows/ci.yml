name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: npm test

      # Loads the real side panel, editor and settings page in headless Chrome
      # (preinstalled on GitHub's Ubuntu runners) against demo data.
      - name: Smoke tests
        run: npm run test:smoke

      - name: Build the store zip
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/*.zip
          if-no-files-found: error
