      <div data-hf-id="hf-xj0z" class="take-title" id="take-title-2"><span data-hf-id="hf-ixae">Your</span> <span data-hf-id="hf-83nm" class="acc">answer,</span> <span data-hf-id="hf-4yf3">beside</span> <span data-hf-id="hf-5u2g">the</span> <span data-hf-id="hf-itxp">bug</span></div>

      <div data-hf-id="hf-qhjf" id="take-cursor">
        <svg data-hf-id="hf-pbbs" viewBox="0 0 32 48"><path data-hf-id="hf-3a0z" d="M2 2 L2 38 L11 29.5 L17.5 44 L24 41 L17.8 26.8 L29.5 26.8 Z" fill="#111111" stroke="#FFFFFF" stroke-width="2.4" stroke-linejoin="round"/></svg>

  <script>
    (function () {
      var R = document.querySelector('[data-composition-id="take"]');
      var $ = function (id) { return R.querySelector("#take-" + id); };
      var tl = gsap.timeline({ paused: true });

      /* ---------- camera ---------- */
      var CAM = {
        hook:   { scale: 1.8, x: 960 - 1150 * 1.8, y: 540 - 775 * 1.8 },
        full:   { scale: 1, x: 0, y: 0 },
        tabs:   { scale: 1.3, x: 0, y: 0 },
        ground: { scale: 0.72, x: 269, y: 242 },
        type:   { scale: 1.75, x: 960 - 1371 * 1.75, y: 540 - 500 * 1.75 },
        answer: { scale: 1.75, x: 960 - 1371 * 1.75, y: 540 - 666 * 1.75 },
        icon:   { scale: 6.61, x: 960 - 1880 * 6.61, y: 540 - 78 * 6.61 }
      };
      var cam = $("cam");
      gsap.set(cam, { transformOrigin: "0 0" });
      tl.set(cam, CAM.hook, 0);
      function camTo(state, t, dur, ease) {
        tl.to(cam, Object.assign({ duration: dur || 0.6, ease: ease || "power2.inOut" }, CAM[state]), t);
      }
      camTo("tabs", 4.3);
      camTo("full", 9.2, 0.55);
      camTo("ground", 10.55);
      camTo("type", 12.4);
      camTo("answer", 16.7);
      camTo("full", 23.2);
      camTo("answer", 24.4);
      camTo("ground", 29.4);
      camTo("icon", 31.55, 0.8, "power2.inOut");

      /* ---------- cursor (screen space; tip = top-left) ---------- */
      var cur = $("cursor");
      tl.set(cur, { x: 975, y: 818 }, 0);
      function move(x, y, t, dur) { tl.to(cur, { x: x, y: y, duration: dur || 0.4, ease: "power2.inOut" }, t); }
      function press(t) {
        tl.to(cur, { scale: 0.88, duration: 0.08, ease: "power2.out" }, t);
        tl.to(cur, { scale: 1, duration: 0.12, ease: "power2.out" }, t + 0.08);
      }
      move(1068, 792, 2.9, 0.5);           // "can we close the checkout bug?": onto the overlap
      move(2000, 1120, 4.3, 0.5);          // leaves with the pull-back
      move(1880, 78, 9.35, 0.5);           // the extension's toolbar button
      press(9.9);
      move(2000, 640, 10.3, 0.5);
      move(1038.75, 821.9, 12.95, 0.5);    // + in the composer
      press(13.6);
      move(1430.75, 362.5, 14.1, 0.38);    // the task in the search results
      press(14.55);
      move(1827.6, 895.4, 16.05, 0.45);    // Send
      press(16.6);
      move(2000, 1120, 16.8, 0.5);
      move(1038.75, 956, 24.75, 0.4);      // + again
      press(25.2);
      move(1163.7, 956, 27.0, 0.3);        // Skills
      press(27.4);
      move(1695.4, 956, 27.85, 0.35);      // model
      press(28.3);
      move(2000, 1120, 29.3, 0.5);

      /* ---------- hook: the chat toast ---------- */
      tl.fromTo($("toast"), { x: 560, opacity: 1 }, { x: 0, duration: 0.6, ease: "expo.out" }, 0.5);
      tl.set($("time-a"), { opacity: 0 }, 8.3);
      tl.set($("time-b"), { opacity: 1 }, 8.3);
      tl.to($("toast"), { x: 560, duration: 0.35, ease: "power3.in" }, 9.6);

      /* ---------- tension: tabs pile up ---------- */
      var pill = $("tab-pill");
      var skelS = $("skel-search"), skelD = $("skel-doc"), skelT = $("skel-task");
      tl.set([$("tab-2"), $("tab-3"), $("tab-4"), $("tab-5"), $("tab-6")], { scaleX: 0, opacity: 0 }, 0);
      function newTab(n, t, activate) {
        tl.to($("tab-" + n), { scaleX: 1, opacity: 1, duration: 0.25, ease: "expo.out" }, t);
        if (activate) tl.to(pill, { x: (n - 1) * 244, duration: 0.2, ease: "power2.out" }, t);
      }
      newTab(2, 5.2, true);  tl.set(skelS, { opacity: 1 }, 5.3);
      newTab(3, 6.3, true);  tl.set(skelT, { opacity: 1 }, 6.4); tl.set(skelS, { opacity: 0 }, 6.4);
      newTab(4, 6.9, true);  tl.set(skelD, { opacity: 1 }, 7.0); tl.set(skelT, { opacity: 0 }, 7.0);
      tl.to(pill, { x: 2 * 244, duration: 0.2, ease: "power2.out" }, 7.15);         // back to the task …
      tl.set(skelT, { opacity: 1 }, 7.25); tl.set(skelD, { opacity: 0 }, 7.25);
      tl.fromTo($("thread"), { y: 0 }, { y: -820, duration: 1.6, ease: "none" }, 7.25); // … and its long comment thread
      newTab(5, 7.6, false);
      newTab(6, 8.0, false);
      // the extra tabs fold away; back on the checkout page
      tl.to([$("tab-6"), $("tab-5"), $("tab-4"), $("tab-3"), $("tab-2")], { scaleX: 0, opacity: 0, duration: 0.22, ease: "power3.in", stagger: 0.06 }, 8.95);
      tl.to(pill, { x: 0, duration: 0.3, ease: "power2.inOut" }, 9.1);
      tl.set(skelT, { opacity: 0 }, 9.2);

      /* ---------- reveal: the side panel ---------- */
      var panel = $("panel");
      tl.set(panel, { x: 580 }, 0);
      tl.set($("p01"), { opacity: 1 }, 0);
      tl.to(panel, { x: 0, duration: 0.55, ease: "expo.out" }, 9.98);
      tl.to($("page"), { scale: 1360 / 1920, transformOrigin: "0 0", duration: 0.55, ease: "expo.out" }, 9.98);

      function title(n, tIn, tOut) {
        var words = $("title-" + n).querySelectorAll("span");
        tl.fromTo(words, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power4.out", stagger: 0.08 }, tIn);
        tl.to(words, { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in", stagger: 0.03 }, tOut);
      }
      title(1, 11.0, 12.3);
      title(2, 29.95, 31.45);

      /* ---------- proof: panel states (hard swaps, as the UI does) ---------- */
      var states = ["p01", "p02", "p02p", "p02pa", "p02pay", "p03", "p05", "p06", "p07", "p08", "p09"];
      function show(id, t) {
        states.forEach(function (s) { tl.set($(s), { opacity: s === id ? 1 : 0 }, t); });
      }
      show("p02", 13.62);
      show("p02p", 13.95);
      show("p02pa", 14.08);
      show("p02pay", 14.22);
      show("p03", 14.58);
      // typing: 21 crops of the real composer, 0.07 s apart
      var tStart = 14.85, step = 0.07, prev = null;
      for (var i = 1; i <= 21; i++) {
        var id = "t" + (i < 10 ? "0" + i : i);
        tl.set($(id), { opacity: 1 }, tStart + (i - 1) * step);
        if (prev) tl.set($(prev), { opacity: 0 }, tStart + (i - 1) * step);
        prev = id;
      }
      show("p05", 16.62);
      tl.set($(prev), { opacity: 0 }, 16.62);

      /* ---------- the answer streams in ---------- */
      show("p06", 17.4);
      tl.set($("stream"), { opacity: 1 }, 17.4);
      tl.set($("tail"), { opacity: 1, y: 0 }, 17.4);
      var bottoms = [291, 309, 338, 357, 380, 405, 433, 452, 481]; // line bottoms, CSS px
      for (var k = 0; k < 9; k++) {
        var t = 17.4 + k * 0.24;
        var dy = k === 8 ? 196 : (bottoms[k] - 267) * 0.92;
        tl.to($("tail"), { y: dy * 1.4, duration: 0.14, ease: "power2.out" }, t);
        tl.fromTo($("c" + (k + 1)), { scaleX: 1 }, { scaleX: 0, duration: 0.22, ease: "power1.inOut" }, t + 0.03);
      }
      tl.set($("stream"), { opacity: 0 }, 19.75);

      function mark(id, t) {
        tl.fromTo($(id), { opacity: 1, scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, t);
      }
      tl.set(["#take-m1", "#take-m2", "#take-m3", "#take-m4"].map(function (s) { return R.querySelector(s); }), { opacity: 0 }, 0);
      mark("m1", 19.85);
      mark("m2", 20.7);
      mark("m3", 21.45);
      tl.to([$("m1"), $("m2"), $("m3")], { opacity: 0, duration: 0.2, ease: "power1.out" }, 24.45);

      /* ---------- extras: +, Deep Research, Skills, model ---------- */
      show("p07", 25.22);
      mark("m4", 26.2);
      tl.set($("m4"), { opacity: 0 }, 27.42);
      show("p08", 27.42);
      show("p09", 28.32);

      window.__timelines["take"] = tl;
    })();
  </script>
