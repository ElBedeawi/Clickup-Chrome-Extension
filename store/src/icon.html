<!doctype html>
<!-- Renders icon.svg at ?size=N with ?pad=P transparent padding (the store's 128px icon wants 16px). -->
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; background: transparent; }
    .box { box-sizing: border-box; }
    img { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <script>
    const params = new URLSearchParams(location.search);
    const size = Number(params.get('size')) || 128;
    const pad = Number(params.get('pad')) || 0;
    const box = document.createElement('div');
    box.className = 'box';
    Object.assign(box.style, { width: `${size}px`, height: `${size}px`, padding: `${pad}px` });
    const img = new Image();
    img.onload = () => (window.__ready = true);
    img.src = 'icon.svg';
    box.append(img);
    document.body.append(box);
  </script>
</body>
</html>
