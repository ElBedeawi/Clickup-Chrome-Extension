<script id="06-private-gsap" src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function () {
  var FRAME_ID = "06-private";
  var DURATION = 7.104;

  function build() {
    if (!window.gsap) return;
    window.__timelines = window.__timelines || {};
    if (window.__timelines[FRAME_ID]) return;

    var root = document.querySelector('[data-composition-id="' + FRAME_ID + '"]');
    if (!root) return;

    var h2 = document.getElementById("06-private-h2");
    var rule = document.getElementById("06-private-rule");
    var glow = document.getElementById("06-private-glow");
    var rows = Array.prototype.slice.call(root.querySelectorAll("[data-06-private-line]"));

    var tl = gsap.timeline({ paused: true });

    /* ── Scene 1 (0.0–1.6s): headline + first line ── */
    // headline fades in upper-left of the column; hero visible well before 0.5s
    tl.fromTo(h2,
      { opacity: 0, y: 14 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
      0);
    // accent-line grows from the left under the same beat
    tl.fromTo(rule,
      { scaleX: 0, opacity: 0 },
      { scaleX: 1, opacity: 1, duration: 0.45, ease: "power2.out" },
      0.06);

    /* ── lines 1–4, each on its voiceover cue (BUILD mode: co-resident, no dimming) ──
       line 1 on "Your own API token", then ~1.9s / ~3.6s / ~5.0s per the shot sequence */
    var CUES = [0.55, 1.9, 3.6, 5.0];
    var POP_DUR = 0.5;      // spring-pop-entrance: smooth power3.out settle, no overshoot
    var DRAW_DUR = 0.4;     // svg-path-draw: power2.out "pen lifts at end of stroke"
    var WIPE_DUR = 0.55;    // clip-path mask-wipe, left → right

    rows.forEach(function (row, i) {
      var at = CUES[i];
      var mark = row.querySelector('[class~="06-private-mark"]');
      var path = row.querySelector("path");
      var text = row.querySelector('[class~="06-private-text"]');

      // measured geometry for the check stroke (fallback if not laid out yet)
      var len = 0;
      try { len = path.getTotalLength(); } catch (e) { len = 0; }
      if (!len || !isFinite(len)) len = 36;
      len = len * 1.05;
      path.style.strokeDasharray = String(len);
      path.style.strokeDashoffset = String(len);

      // 1. primary circle marker pops (scale 0 → 1, smooth long-tail settle)
      tl.fromTo(mark,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: POP_DUR, ease: "power3.out" },
        at);

      // 2. the check draws inside the marker (dashoffset len → 0)
      tl.fromTo(path,
        { strokeDashoffset: len },
        { strokeDashoffset: 0, duration: DRAW_DUR, ease: "power2.out" },
        at + 0.22);

      // 3. the text wipes in left → right (clip-path reveal)
      tl.fromTo(text,
        { clipPath: "inset(0% 100% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: WIPE_DUR, ease: "power2.out" },
        at + 0.18);
    });

    /* ── Scene 3 (5.6–7.1s): held read; the last check gets one primary glow pulse ──
       ambient-glow-bloom, pulse-on-arrival form: bloom slightly past peak as line 4 settles,
       then ease down to a steady hold. Single pass, no loop; peak ≤ 0.45. */
    tl.fromTo(glow,
      { opacity: 0, scale: 0.8 },
      { opacity: 0.40, scale: 1.06, duration: 0.6, ease: "power2.out" },
      5.45);
    tl.to(glow,
      { opacity: 0.22, scale: 1.0, duration: 0.85, ease: "power2.inOut" },
      6.05);

    // pin the timeline to the frame's fixed duration (no exit — the root transition owns that)
    tl.set({}, {}, DURATION);

    window.__timelines[FRAME_ID] = tl;
  }

  if (window.gsap) {
    build();
  } else {
    var loader = document.getElementById("06-private-gsap");
    if (loader) loader.addEventListener("load", build);
  }
})();
</script>
