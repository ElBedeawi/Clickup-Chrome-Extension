  <script>
    (function () {
      var FRAME_ID = "05-clips";

      var card = $("card");
      var lines = [$("line-1"), $("line-2"), $("line-3")];
      var bracket = $("bracket-path");
      var hlTab = $("hl-tab");
      var hlToggle = $("hl-toggle");

      var tl = gsap.timeline({ paused: true });

      /* ---- Scene 1 (0.0–1.5s): title card. One move, then hold. ---- */
      // The chip's resting slot is the headline row (left 96 / top 270); in Scene 1
      // it sits scaled-up at the canvas centre via x/y offsets.
      var CHIP_X = 817, CHIP_Y = 88, CHIP_BIG = 2.2;
      tl.fromTo(chip,
        { scale: 0, opacity: 0, x: CHIP_X, y: CHIP_Y },
        { scale: CHIP_BIG, opacity: 1, x: CHIP_X, y: CHIP_Y, duration: 0.55, ease: "power3.out" },
        0.02);
      tl.fromTo(title,
        { opacity: 0, scale: 0.95 },
        { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" },
        0.3);

      /* ---- Scene 2 (1.5–3.2s): blur-away → snap-into-focus handoff ---- */
      // outgoing title card: text-scale blur (10px), dims on a linear opacity channel
      tl.to(title, { "--dof": "10px", scale: 0.96, duration: 0.4, ease: "power2.in" }, 1.5);
      tl.to(title, { opacity: 0, duration: 0.4, ease: "none" }, 1.5);
      // incoming product window: pre-blurred (full-frame surface, 18px) snaps sharp
      tl.fromTo(card,
        { "--dof": "18px", opacity: 0.15, scale: 1.05 },
        { "--dof": "0px", opacity: 1, scale: 1, duration: 0.7, ease: "expo.out" },
        1.62);
      // the NEW chip shrinks into the headline row (plain scale + position tween)
      tl.to(chip, { scale: 1, x: 0, y: 0, duration: 0.7, ease: "power3.inOut" }, 1.55);
      tl.fromTo(h2,
        { opacity: 0, x: -14 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" },
        2.0);

      // bracket draws around the Clips tab + the Save-to-Clips toggle row
      var len = 1040;
      try { var m = bracket.getTotalLength(); if (m && isFinite(m) && m > 0) len = m * 1.05; } catch (e) {}
      bracket.style.strokeDasharray = String(len);
      bracket.style.strokeDashoffset = String(len);
      tl.to(bracket, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 2.35);

      /* ---- Scene 3 (3.2–5.4s): three value lines, one per VO cue ---- */
      var LINE_AT = [3.3, 4.0, 4.75];
      lines.forEach(function (el, i) {
        tl.fromTo(el,
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          LINE_AT[i]);
      });

      /* ---- keyword glow: one linear driver, attack/sustain/release envelope ----
         Applied to highlight overlays over the raster UI (the tab and the toggle
         row are image pixels, not glyphs), so the glow rides box-shadow + border. */
      var ATTACK = 0.15, RELEASE = 0.4, REST = 0.2, MAX_BLUR = 20, MAX_SCALE = 0.06;
      var HL = [
        { el: hlTab, start: 2.75, end: 3.25 },     // "…ClickUp Clips"
        { el: hlToggle, start: 4.85, end: 5.45 }   // "no task needed"
      ];
      function envelope(t, s, e) {
        if (t < s) return 0;
        if (t < e) return Math.min((t - s) / ATTACK, 1);
        var re = e + RELEASE;
        if (t < re) return 1 - ((t - e) / RELEASE) * (1 - REST);
        return REST;
      }
      function paint(el, env) {
        el.style.boxShadow = "0 0 " + (MAX_BLUR * env).toFixed(2) + "px rgba(123,104,238," + (0.85 * env).toFixed(3) + ")";
        el.style.borderColor = "rgba(123,104,238," + env.toFixed(3) + ")";
        el.style.backgroundColor = "rgba(123,104,238," + (0.12 * env).toFixed(3) + ")";
        el.style.transform = "scale(" + (1 + MAX_SCALE * env).toFixed(4) + ")";
      }
      var driver = { t: 0 };
      tl.to(driver, {
        t: DURATION,
        duration: DURATION,
        ease: "none",
        onUpdate: function () {
          HL.forEach(function (h) { paint(h.el, envelope(driver.t, h.start, h.end)); });
        }
      }, 0);
      HL.forEach(function (h) { paint(h.el, 0); });
